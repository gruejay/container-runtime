site_name: boxr container runner
site_url: https://gruejay.github.io/container-runtime
site_description: A simple container runtime implementation
theme:
  name: terminal
  palette: dark
  features:
    - navigation.side.indexes

nav:
  - Home: index.md
  - Steps:
    - Index: steps/index.md
    - 'Step 1: Getting Started': steps/step1.md
    - 'Step 2: Namespaces (Part 1)': steps/step2.md
    - 'Step 3: Filesystem (Part 1)': steps/step3.md
    - 'Step 4: Filesystems (Part 2)': steps/step4.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      noclasses: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details

repo_url: https://github.com/gruejay/container-runtime
